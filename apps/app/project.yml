name: notifi

options:
  bundleIdPrefix: it.notifi
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
  configs:
    Debug:
      API_BASE_URL: "https://notifi-api-dev.maxisme.workers.dev"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      API_BASE_URL: "https://app.notifi.it"

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.0"

targets:
  notifi-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: notifi
        PRODUCT_BUNDLE_IDENTIFIER: it.notifi.app
        INFOPLIST_FILE: Support/Info/App-iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Entitlements/notifi-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: NotificationService-iOS
      - package: MarkdownUI

  notifi-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: notifi
        PRODUCT_BUNDLE_IDENTIFIER: it.notifi.app
        INFOPLIST_FILE: Support/Info/App-macOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Entitlements/notifi-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
    dependencies:
      - target: NotificationService-macOS
      - package: MarkdownUI

  NotificationService-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Shared/Identity/DeviceIdentity.swift
      - path: Shared/API/ContractModels.swift
      - path: Shared/Support/NotifiError.swift
    settings:
      base:
        PRODUCT_NAME: NotificationService
        PRODUCT_BUNDLE_IDENTIFIER: it.notifi.app.nse
        INFOPLIST_FILE: Support/Info/NotificationService-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Entitlements/NotificationService-iOS.entitlements

  NotificationService-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: NotificationService
      - path: Shared/Identity/DeviceIdentity.swift
      - path: Shared/API/ContractModels.swift
      - path: Shared/Support/NotifiError.swift
    settings:
      base:
        PRODUCT_NAME: NotificationService
        PRODUCT_BUNDLE_IDENTIFIER: it.notifi.app.nse
        INFOPLIST_FILE: Support/Info/NotificationService-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Entitlements/NotificationService-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"

schemes:
  notifi-iOS:
    build:
      targets:
        notifi-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  notifi-macOS:
    build:
      targets:
        notifi-macOS: all
    run:
      config: Debug
    archive:
      config: Release
