name: notifi

options:
  bundleIdPrefix: it.notifi
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Localizable.xcstrings carrying a language is not enough on its own: Xcode
  # ships only the regions the project knows, so a language missing here is
  # translated and then dropped from the bundle. Keep in step with
  # LANGUAGE_CODES in packages/copy/src/languages.ts.
  knownRegions: [Base, en, es, de, fr, it]

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Not the source of truth for a release: the app.yml release workflow
    # overrides this per build with the `v*` tag it was triggered by (see the
    # Fastfile's marketing_version_xcargs / release_version), so a signed build
    # never carries whatever is checked in here. This value only reaches a
    # local Debug/Simulator build, which never ships and does not need a real
    # version -- so there is nothing to keep bumped.
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    # Empty when the variables are unset, which is how Xcode spells "automatic
    # signing" -- so a local build needs no setup. CI sets all three, because
    # automatic signing mints a fresh Development certificate on every clean
    # runner and never cleans one up, which fills the account's certificate cap.
    CODE_SIGN_STYLE: ${CODE_SIGN_STYLE}
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
  configs:
    Debug:
      # `make dev` on this Mac, never production. Debug signs with
      # aps-environment=development, so its token only works against sandbox
      # APNs: point APNS_HOST at api.sandbox.push.apple.com in
      # apps/api/.dev.vars or every push dies with BadDeviceToken. The
      # cleartext load is permitted by NSAllowsLocalNetworking in the
      # Info.plists. Reachable from the Simulator, not from a device over Wi-Fi.
      API_BASE_URL: "http://localhost:8787"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      API_BASE_URL: "https://notifi.it"

# Sparkle is the auto-updater for the direct-download macOS build. It is attached
# to the notifi-macOS target only: iOS updates through the App Store and must not
# link it, and notifi-macOS-AppStore must not either -- the Mac App Store rejects
# self-updating apps and Sparkle's temporary-exception entitlements outright.
# Everything that imports Sparkle in Shared/ is behind canImport(Sparkle), so the
# store target compiles the updater out simply by not depending on the package.
# Pinned exactly, not a range. Package.resolved lives inside the generated
# notifi.xcodeproj, which is gitignored, so a range would let CI and a fresh
# checkout silently resolve a different Sparkle than the one that was verified --
# in the component that signs and installs updates on users' machines. Bump
# deliberately.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.5"
  Textual:
    url: https://github.com/gonzalezreal/textual
    exactVersion: "0.5.0"

targets:
  notifi-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Support/Privacy/App/PrivacyInfo.xcprivacy
      - path: Support/Info/LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_NAME: notifi
        PRODUCT_BUNDLE_IDENTIFIER: it.notifi.notifi
        INFOPLIST_FILE: Support/Info/App-iOS-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        PROVISIONING_PROFILE_SPECIFIER: ${IOS_APP_PROFILE}
        CODE_SIGN_IDENTITY: ${IOS_CODE_SIGN_IDENTITY}
      # aps-environment has to track the configuration. Release points at the
      # production Worker, and a production Worker talks to the production APNs
      # host, which rejects a sandbox token as BadDeviceToken.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Support/Entitlements/notifi-iOS-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Support/Entitlements/notifi-iOS-Release.entitlements
    dependencies:
      - target: NotificationService-iOS
      - package: Textual

  notifi-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Support/Privacy/App/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: notifi
        PRODUCT_BUNDLE_IDENTIFIER: it.notifi.notifi
        INFOPLIST_FILE: Support/Info/App-macOS-Info.plist
        ENABLE_HARDENED_RUNTIME: "YES"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Support/Entitlements/notifi-macOS-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Support/Entitlements/notifi-macOS-Release.entitlements
    dependencies:
      - target: NotificationService-macOS
      - package: Sparkle
      - package: Textual

  # The Mac App Store variant of notifi-macOS: same bundle id (one App Store
  # Connect record, universal purchase with iOS), same sources, but no Sparkle,
  # no temporary-exception entitlements, and an Info.plist without the SU* keys.
  notifi-macOS-AppStore:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Support/Privacy/App/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: notifi
        PRODUCT_BUNDLE_IDENTIFIER: it.notifi.notifi
        INFOPLIST_FILE: Support/Info/App-macOS-AppStore-Info.plist
        ENABLE_HARDENED_RUNTIME: "YES"
        PROVISIONING_PROFILE_SPECIFIER: ${MAC_APP_PROFILE}
        CODE_SIGN_IDENTITY: ${MAC_CODE_SIGN_IDENTITY}
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Support/Entitlements/notifi-macOS-AppStore-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Support/Entitlements/notifi-macOS-AppStore-Release.entitlements
    dependencies:
      - target: NotificationService-macOS
      - package: Textual

  NotificationService-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Shared/Identity/DeviceIdentity.swift
      - path: Shared/API/ContractModels.swift
      # The catalog, not just the accessors: NSLocalizedString resolves against
      # the running bundle, which for an extension is the extension's own.
      - path: Shared/Resources/Localizable.xcstrings
      - path: Shared/Support/Copy.swift
      - path: Shared/Support/NotifiError.swift
      - path: Shared/Support/RemoteImages.swift
      - path: Shared/Support/MarkdownPreview.swift
      # LinkPolicy is compiled in for its https rule alone -- the extension
      # decides which category a push carries. Its allow-list accessors read the
      # app's UserDefaults, which the extension does not share, so they must not
      # be called from here.
      - path: Shared/Support/LinkPolicy.swift
      - path: Shared/Push/NotificationCategories.swift
      - path: Support/Privacy/NotificationService/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: NotificationService
        PRODUCT_BUNDLE_IDENTIFIER: it.notifi.notifi.nse
        INFOPLIST_FILE: Support/Info/NotificationService-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Entitlements/NotificationService-iOS.entitlements
        PROVISIONING_PROFILE_SPECIFIER: ${IOS_NSE_PROFILE}
        CODE_SIGN_IDENTITY: ${IOS_CODE_SIGN_IDENTITY}

  NotificationService-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: NotificationService
      - path: Shared/Identity/DeviceIdentity.swift
      - path: Shared/API/ContractModels.swift
      # The catalog, not just the accessors: NSLocalizedString resolves against
      # the running bundle, which for an extension is the extension's own.
      - path: Shared/Resources/Localizable.xcstrings
      - path: Shared/Support/Copy.swift
      - path: Shared/Support/NotifiError.swift
      - path: Shared/Support/RemoteImages.swift
      - path: Shared/Support/MarkdownPreview.swift
      # LinkPolicy is compiled in for its https rule alone -- the extension
      # decides which category a push carries. Its allow-list accessors read the
      # app's UserDefaults, which the extension does not share, so they must not
      # be called from here.
      - path: Shared/Support/LinkPolicy.swift
      - path: Shared/Push/NotificationCategories.swift
      - path: Support/Privacy/NotificationService/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: NotificationService
        PRODUCT_BUNDLE_IDENTIFIER: it.notifi.notifi.nse
        PROVISIONING_PROFILE_SPECIFIER: ${MAC_NSE_PROFILE}
        CODE_SIGN_IDENTITY: ${MAC_CODE_SIGN_IDENTITY}
        INFOPLIST_FILE: Support/Info/NotificationService-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Entitlements/NotificationService-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"

schemes:
  notifi-iOS:
    build:
      targets:
        notifi-iOS: all
    run:
      config: Debug
    archive:
      config: Release
  notifi-macOS:
    build:
      targets:
        notifi-macOS: all
    run:
      config: Debug
    archive:
      config: Release
  notifi-macOS-AppStore:
    build:
      targets:
        notifi-macOS-AppStore: all
    run:
      config: Debug
    archive:
      config: Release
