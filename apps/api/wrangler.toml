name = "notifi-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"
# Sentry's Cloudflare SDK tracks the current scope through `AsyncLocalStorage`,
# which is `node:async_hooks` and so needs this flag. Without it the Worker
# fails at deploy rather than at runtime.
compatibility_flags = ["nodejs_compat"]
routes = [{ pattern = "notifi.it", custom_domain = true }]

# The marketing site. Static files are served straight from ./public for any
# path that matches a file; every other request falls through to the Worker, so
# /send, /keys, /devices and /history are untouched.
#
# The pages listed in run_worker_first are the exception: the Worker sees those
# requests before the asset bucket does, because it has to negotiate between the
# HTML page and its Markdown sibling (acceptmarkdown.com) and cannot do that
# once the bucket has already answered. Everything else — fonts, screenshots,
# the icons, robots.txt, the .html forms that 307 to the extensionless ones —
# keeps the asset-first path and the _headers rules that go with it.
#
# The binding is what lets the Worker ask the bucket for a specific file: the
# .md sibling, or the 404 page it serves as the body of a 404.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [
  "/",
  "/about",
  "/contact",
  "/docs",
  "/faq",
  "/privacy",
  "/terms",
  "/index.md",
  "/about.md",
  "/contact.md",
  "/docs.md",
  "/faq.md",
  "/privacy.md",
  "/terms.md",
  "/404.md",
  "/llms.txt",
]

[[d1_databases]]
binding = "DB"
database_name = "notifi-prod"
database_id = "e6e8c82f-779f-4e27-9621-97426939ea9b"

[vars]
APNS_HOST = "https://api.push.apple.com"
APNS_TOPIC = "it.notifi.notifi"
# Names the Sentry environment. The DSN is a secret and is not here.
SENTRY_ENVIRONMENT = "production"

[[durable_objects.bindings]]
name = "DEVICE_SOCKET"
class_name = "DeviceSocket"

[[durable_objects.bindings]]
name = "APNS_TOKEN"
class_name = "ApnsToken"

# SQLite-backed, which is the only option for new namespaces and is what the
# hibernation API expects. The class stores nothing; the tag is still required.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceSocket"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ApnsToken"]

[observability]
enabled = true
head_sampling_rate = 1

[[unsafe.bindings]]
name = "SEND_IP_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 100, period = 60 }
