name = "notifi-api-dev"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# The marketing site. Static files are served straight from ./public for any
# path that matches a file; every other request falls through to the Worker, so
# /send, /keys, /devices and /history are untouched.
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "notifi-dev"
database_id = "922cd206-7142-4b75-9af2-05f5fd7e1ba2"

[vars]
APNS_HOST = "https://api.sandbox.push.apple.com"
APNS_TOPIC = "it.notifi.app"

[triggers]
crons = ["0 3 * * *"]

[[unsafe.bindings]]
name = "SEND_IP_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[env.production]
name = "notifi-api"
routes = [{ pattern = "notifi.it", custom_domain = true }]

[env.production.assets]
directory = "./public"

[env.production.vars]
APNS_HOST = "https://api.push.apple.com"
APNS_TOPIC = "it.notifi.app"

[[env.production.d1_databases]]
binding = "DB"
database_name = "notifi-prod"
database_id = "e6e8c82f-779f-4e27-9621-97426939ea9b"

[env.production.triggers]
crons = ["0 3 * * *"]

[[env.production.unsafe.bindings]]
name = "SEND_IP_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 100, period = 60 }
