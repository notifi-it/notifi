name: notifi
description: A multi platform app to receive push notifications over simple HTTP requests you can embed anywhere.

publish_to: 'none'
version: 0.0.1

environment:
  sdk: ">=2.12.0 <4.0.0"

dependencies:
  akar_icons_flutter: ^1.1.21
  app_settings: ^7.0.0
  cached_network_image: ^3.1.0
  desktop_window: ^0.4.0
  dio: ^5.9.0
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter:
    sdk: flutter
  flutter_app_icon_badge: ^2.0.0
  flutter_dotenv: ^6.0.0
  flutter_emoji: ^2.2.1+1
  flutter_local_notifications: ^19.5.0
  flutter_secure_storage: ^10.0.0
  flutter_slidable: ^4.0.3
  intl: ^0.20.2
  json_serializable: ^6.0.1

  launch_review: ^3.0.1
  local_auth: ^3.0.0

  package_info_plus: ^9.0.0
  path_provider: ^2.0.2
  provider: ^6.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.0.6
  sqflite: ^2.0.0+3
  sqflite_common_ffi: ^2.0.0+1
  timeago: ^3.0.2
  fluttertoast: ^9.0.0
  url_launcher: ^6.0.9
  uuid: ^4.5.2
  web_socket_channel: ^3.0.3

  path: any
  http: any
  json_annotation: any
dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_native_splash: ^2.1.2+1
  flutter_test:
    sdk: flutter
  test: ^1.16.8

  http: any
flutter:
  uses-material-design: false
  assets:
    - images/bell.png
    - images/sad.png
    - .env
    - pubspec.yaml
    - snap/gui/notifi.desktop
  fonts:
    - family: Inconsolata
      fonts:
        - asset: fonts/Inconsolata.ttf
          weight: 400
        - asset: fonts/Inconsolata-Medium.ttf
          weight: 500
        - asset: fonts/Inconsolata-Bold.ttf
          weight: 700
        - asset: fonts/Inconsolata-Black.ttf
          weight: 900

flutter_native_splash:
  color: "#f5f5f5"
  image: images/bell.png