name: reviews

# Apple refuses itunes.apple.com RSS requests from Cloudflare's egress
# addresses (every storefront answers 403 from the deployed Worker), so the
# Worker cannot fetch its own reviews. This fetches them from the authenticated
# App Store Connect API with the same key the app workflow already holds, and
# writes them straight into the production D1 the site reads.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch reviews from App Store Connect
        working-directory: apps/api
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          REVIEWS_JSON: /tmp/reviews.json
        run: |
          ASC_PRIVATE_KEY="$(echo "$ASC_API_KEY_P8" | base64 --decode)" \
            node scripts/fetch-reviews.mjs > /tmp/reviews.sql
      - name: Remember which reviews D1 already has
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >
          pnpm wrangler d1 execute notifi-prod --remote --env production
          --command "SELECT id FROM app_reviews" --json > /tmp/existing.json
      - name: Write the fetched reviews to production D1
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm wrangler d1 execute notifi-prod --remote --env production --file /tmp/reviews.sql
      # After the write, so a failed run never announces a review the site
      # does not show. notifi pushing its own App Store reviews through /send
      # is the point: the product is its own monitor.
      - name: Push any new review through notifi
        working-directory: apps/api
        env:
          NOTIFI_SEND_KEY: ${{ secrets.NOTIFI_SEND_KEY }}
        run: node scripts/notify-new-reviews.mjs /tmp/existing.json /tmp/reviews.json
