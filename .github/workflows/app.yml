name: app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/app/**"
      - "packages/contract/**"
  pull_request:
    paths:
      - "apps/app/**"
      - "packages/contract/**"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/') == false }}

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/') == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: brew install xcodegen
      - working-directory: apps/app
        run: xcodegen generate
      - working-directory: apps/app
        run: |
          xcodebuild build \
            -scheme notifi-iOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - working-directory: apps/app
        run: |
          xcodebuild build \
            -scheme notifi-macOS \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    environment: production
    env:
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: brew install xcodegen
      - working-directory: apps/app
        # DEVELOPMENT_TEAM is interpolated into project.yml by XcodeGen. Without it
        # automatic signing cannot resolve a profile and the archive step fails.
        run: xcodegen generate
      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
      - name: Write export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions-appstore.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST
      - name: Archive and upload iOS
        working-directory: apps/app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -scheme notifi-iOS \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/notifi-iOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/notifi-iOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-appstore.plist" \
            -exportPath "$RUNNER_TEMP/export-iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Archive and upload macOS
        working-directory: apps/app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -scheme notifi-macOS \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/notifi-macOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/notifi-macOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-appstore.plist" \
            -exportPath "$RUNNER_TEMP/export-macOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
