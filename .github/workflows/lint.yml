name: lint

# Runs on every PR regardless of paths: the comment linter covers Swift and
# TypeScript alike, and the api workflow's path filter would skip app-only PRs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/lint-comments.mjs
      # check-migrations validates the schema, which needs the pinned prisma:
      # a bare npx fetches the newest major and fails on syntax this one accepts.
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-migrations.mjs
