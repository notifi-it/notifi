name: api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/contract/**"
      - "packages/copy/**"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contract/**"
      - "packages/copy/**"

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @notifi/contract --filter @notifi/copy --filter @notifi/api typecheck
      # Copy.swift is generated from packages/copy. Regenerate in memory and fail
      # if what is committed has drifted -- the app compiles either way, so
      # nothing else would notice.
      - run: pnpm --filter @notifi/copy check-copy

  deploy-production:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations must run before the code that depends on them is live.
      - working-directory: apps/api
        run: pnpm wrangler d1 migrations apply notifi-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The release a Sentry event is attributed to. Passed at deploy rather than
      # written into wrangler.toml, because it is the commit being deployed and
      # nothing in the tree knows that. `--var` merges with the configured vars.
      - working-directory: apps/api
        run: pnpm wrangler deploy --var SENTRY_RELEASE:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The site's static assets are edge-cached for a week, so a deploy that
      # changes them would otherwise serve the old files until the cache
      # expires. Purge everything: the site is a handful of files, so the
      # refill cost is nothing next to a week of stale screenshots. Requires
      # the token to carry Zone.Cache Purge and Zone.Zone (read).
      - name: Purge the notifi.it edge cache
        run: |
          set -euo pipefail
          zone=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=notifi.it" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"][0]["id"])')
          curl -sf -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" >/dev/null
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The site is only as agent-ready as the deployed Worker: this asks the
      # live origin for the Markdown variant of every page, the Vary and Link
      # headers, the 406 and the 404, and fails the deploy loudly if the
      # negotiation regressed. It runs after the purge so it reads the new
      # assets rather than the cached old ones.
      - name: Verify the site answers agents
        run: node scripts/check-site.mjs
